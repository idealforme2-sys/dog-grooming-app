<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
  <!-- Outer subtle drop shadow -->
  <filter id="pawShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-color="#2E1D5A" flood-opacity="0.35"/>
  </filter>

  <g filter="url(#pawShadow)">
    <!-- White outer stroke for high contrast on dark backgrounds -->
    <!-- Main Center Pad -->
    <path d="M12 14C8.8 14 6.5 16.5 7.2 20C7.8 22.8 10.5 24 12 24C13.5 24 16.2 22.8 16.8 20C17.5 16.5 15.2 14 12 14Z" fill="#EA4D89" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
    
    <!-- 4 Little Toes -->
    <ellipse cx="6" cy="11.5" rx="2.4" ry="3.2" transform="rotate(-25 6 11.5)" fill="#EA4D89" stroke="#FFFFFF" stroke-width="1.8"/>
    <ellipse cx="10" cy="8" rx="2.5" ry="3.4" transform="rotate(-8 10 8)" fill="#EA4D89" stroke="#FFFFFF" stroke-width="1.8"/>
    <ellipse cx="15" cy="8.5" rx="2.5" ry="3.4" transform="rotate(10 15 8.5)" fill="#EA4D89" stroke="#FFFFFF" stroke-width="1.8"/>
    <ellipse cx="19" cy="12.5" rx="2.4" ry="3.2" transform="rotate(28 19 12.5)" fill="#EA4D89" stroke="#FFFFFF" stroke-width="1.8"/>

    <!-- Subtle inner highlight -->
    <ellipse cx="12" cy="18" rx="2.5" ry="1.8" fill="#FFFFFF" opacity="0.35"/>
  </g>
</svg>
