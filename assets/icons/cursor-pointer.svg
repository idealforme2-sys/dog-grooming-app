<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30" fill="none">
  <!-- Outer drop shadow -->
  <filter id="pointerShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="1" dy="1.5" stdDeviation="1.2" flood-color="#2E1D5A" flood-opacity="0.38"/>
  </filter>

  <g filter="url(#pointerShadow)">
    <!-- Golden 4-point Sparkle at top-left click point -->
    <path d="M5 0L6.5 4L10 5L6.5 6L5 10L3.5 6L0 5L3.5 4L5 0Z" fill="#F59F00" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="5" cy="5" r="1.5" fill="#FFE066"/>

    <!-- Angled Cute Paw -->
    <g transform="translate(4, 2) rotate(10 13 15)">
      <!-- Main Center Pad -->
      <path d="M13 14C9.8 14 7.5 16.5 8.2 20C8.8 22.8 11.5 24 13 24C14.5 24 17.2 22.8 17.8 20C18.5 16.5 16.2 14 13 14Z" fill="#D83776" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
      
      <!-- 4 Little Toes -->
      <ellipse cx="7" cy="11.5" rx="2.4" ry="3.2" transform="rotate(-25 7 11.5)" fill="#D83776" stroke="#FFFFFF" stroke-width="1.8"/>
      <ellipse cx="11" cy="8" rx="2.5" ry="3.4" transform="rotate(-8 11 8)" fill="#D83776" stroke="#FFFFFF" stroke-width="1.8"/>
      <ellipse cx="16" cy="8.5" rx="2.5" ry="3.4" transform="rotate(10 16 8.5)" fill="#EA4D89" stroke="#FFFFFF" stroke-width="1.8"/>
      <ellipse cx="20" cy="12.5" rx="2.4" ry="3.2" transform="rotate(28 20 12.5)" fill="#EA4D89" stroke="#FFFFFF" stroke-width="1.8"/>

      <!-- Inner Glow -->
      <ellipse cx="13" cy="18" rx="2.5" ry="1.8" fill="#FFFFFF" opacity="0.45"/>
    </g>
  </g>
</svg>
